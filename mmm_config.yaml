# ベイズ MMM 設定ファイル
# 実行: python -m mmm run --config mmm_config.yaml

# BigQuery 利用時のプロジェクト（config.yaml と同じ値）
gcp:
  project_id: "your-gcp-project-id"

data:
  source: csv                     # csv / bigquery
  csv_path: data/sample_mmm.csv   # source=csv のとき（この設定ファイルからの相対パス可）
  bigquery:                       # source=bigquery のとき（query か table のどちらか）
    # table: "your-project.mmm.weekly_input"
    # query: "SELECT week AS date, sales, tv_spend, ... FROM ..."
    location: "asia-northeast1"
  date_column: date               # 週次・1 行/週
  target_column: sales

# 広告チャネル（支出額の列）。広告効果は常に正に制約される。
channels:
  - name: tv
    column: tv_spend
    adstock: delayed              # geometric / delayed（ピークが遅れて来る）
    # max_lag: 8                  # チャネル個別の最大ラグ（省略時 model.adstock_max_lag）
    # roi_prior:                  # 任意: リフト試験等の知見で上書き → ROI ~ LogNormal(log(mean), sd)
    #   mean: 1.5
    #   sd: 0.4
  - name: search
    column: search_spend
    adstock: geometric
  - name: social
    column: social_spend
    adstock: geometric

# 広告以外のコントロール変数（標準化して投入）。sign: free / positive / negative
controls:
  - column: price
    sign: negative
  - column: promo
    sign: positive

model:
  adstock_max_lag: 8
  trend: true
  seasonality:
    fourier_order: 2              # 0 で季節性なし
    period_weeks: 52.18
  # 全チャネル共通の ROI 事前（roi_prior 未指定チャネルに適用）。中央値 1, 94%区間 ≈ [0.15, 6.5]
  # null にすると係数 ~ HalfNormal(beta_prior_sigma) に切替
  default_roi_prior:
    mean: 1.0
    sd: 1.0
  beta_prior_sigma: 1.0

sampler:
  speed: standard                 # fast（試行用・数分）/ standard / precise（最終報告用）
  # draws: 1000                   # 個別指定するとプリセットより優先
  # tune: 1000
  # chains: 4
  target_accept: 0.95
  random_seed: 42
  nuts_sampler: auto              # auto = numpyro（高速）があれば使う / pymc / numpyro / nutpie

validation:
  holdout_weeks: 12               # 0 で検証なし
  refit_full: true                # 検証後に全期間で再推定して分析に使う

optimization:
  enabled: true
  period_weeks: 52                # 直近何週の予算を最適化するか
  total_budget: null              # null = 対象期間の実績総額
  lower_bound: 0.7                # 現状比の下限倍率（全チャネル共通）
  upper_bound: 1.3                # 現状比の上限倍率
  channel_bounds: {}              # 例: {tv: {lower: 0.9, upper: 1.1}}

# シナリオシミュレーション（run 時にレポートへ掲載。`python -m mmm simulate` で再推定なしに試算も可）
# multipliers: 現状比の倍率 / spend: 期間合計の支出額。未指定チャネルは現状維持
scenarios:
  - name: "TV +50%"
    multipliers: {tv: 1.5}
  - name: "SNSを半減し検索へ"
    period_weeks: 26
    multipliers: {social: 0.5, search: 1.2}

response_curve:
  max_multiplier: 2.0

output:
  dir: mmm_output
  bigquery:
    enabled: false                # true で結果テーブルを BQ に書き戻し
    dataset_id: "mmm_results"
    table_prefix: "mmm_"
    location: "asia-northeast1"
