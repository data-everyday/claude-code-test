# ベイズ MMM 設定ファイル
# 実行: python -m mmm run --config mmm_config.yaml

# BigQuery 利用時のプロジェクト（config.yaml と同じ値）
gcp:
  project_id: "your-gcp-project-id"

data:
  source: csv                     # csv / bigquery
  csv_path: data/sample_mmm.csv   # source=csv のとき（この設定ファイルからの相対パス可）
  bigquery:                       # source=bigquery のとき（query か table のどちらか）
    # table: "your-project.mmm.weekly_input"
    # query: "SELECT week AS date, sales, tv_spend, ... FROM ..."
    location: "asia-northeast1"
  date_column: date               # 週次・1 行/週
  target_column: sales

# 広告チャネル（支出額の列）。広告効果は常に正に制約される。
channels:
  - name: tv
    column: tv_spend
    adstock: delayed              # geometric / delayed（ピークが遅れて来る）
    # max_lag: 13                 # チャネル個別の最大ラグ 1〜20（省略時 model.adstock_max_lag）
    # roi_prior:                  # 任意: リフト試験等の知見で上書き → ROI ~ LogNormal(log(median), sd)
    #   median: 1.5
    #   sd: 0.4
  - name: search
    column: search_spend
    adstock: geometric
  - name: social
    column: social_spend
    adstock: geometric

# 広告以外のコントロール変数（標準化して投入）。sign: free / positive / negative
controls:
  - column: price
    sign: negative
  - column: promo
    sign: positive

model:
  adstock_max_lag: 13             # 最大ラグ（週）1〜20。効果の実際の長さは推定される減衰率で決まる
  # トレンド: none / linear（期間全体で 1 本の直線）/ changepoint（区分線形。一定間隔で傾きが変われる）
  trend: linear
  changepoint:                    # trend: changepoint のときのみ使用
    interval_weeks: 26            # 変化点の候補を何週ごとに置くか
    prior_scale: 0.05             # 傾き変化の大きさの事前（大きいほど柔軟。大きすぎると広告効果を吸収）
    range: 0.9                    # 変化点を置く範囲（先頭から 9 割。末尾は外挿が不安定になるため）
  seasonality:
    fourier_order: 2              # 0 で季節性なし
    period_weeks: 52.18
  # roi_prior 未指定チャネルの ROI 事前分布（ROI = KPI 増分 ÷ 広告費。単位は KPI 次第）
  #   auto: ROI 中央値 = ad_share × KPI 合計 ÷ 広告費合計（KPI が売上でも件数でも自動で単位が合う）
  #         ad_share = 「KPI のうち広告で説明される割合」の想定（0.2 = 20%）
  #   sd:   対数スケールの幅。1.0 で中央値の約 1/6.6〜6.6 倍が 94% 範囲（広め＝データ優先）
  #   ROI を直接指定する場合: {median: 1.5, sd: 1.0}。null で係数 ~ HalfNormal(beta_prior_sigma)
  default_roi_prior:
    mode: auto
    ad_share: 0.2
    sd: 1.0
  beta_prior_sigma: 1.0

sampler:
  speed: standard                 # fast（試行用・数分）/ standard / precise（最終報告用）
  # draws: 1000                   # 個別指定するとプリセットより優先
  # tune: 1000
  # chains: 4
  target_accept: 0.95
  random_seed: 42
  nuts_sampler: auto              # auto = numpyro（高速）があれば使う / pymc / numpyro / nutpie

validation:
  holdout_weeks: 12               # 0 で検証なし
  refit_full: true                # 検証後に全期間で再推定して分析に使う

optimization:
  enabled: true
  period_weeks: 52                # 直近何週の予算を最適化するか
  total_budget: null              # null = 対象期間の実績総額
  lower_bound: 0.7                # 現状比の下限倍率（全チャネル共通）
  upper_bound: 1.3                # 現状比の上限倍率
  channel_bounds: {}              # 例: {tv: {lower: 0.9, upper: 1.1}}

# シナリオシミュレーション（run 時にレポートへ掲載。`python -m mmm simulate` で再推定なしに試算も可）
# multipliers: 現状比の倍率 / spend: 期間合計の支出額。未指定チャネルは現状維持
scenarios:
  - name: "TV +50%"
    multipliers: {tv: 1.5}
  - name: "SNSを半減し検索へ"
    period_weeks: 26
    multipliers: {social: 0.5, search: 1.2}

response_curve:
  max_multiplier: 2.0

output:
  dir: mmm_output
  bigquery:
    enabled: false                # true で結果テーブルを BQ に書き戻し
    dataset_id: "mmm_results"
    table_prefix: "mmm_"
    location: "asia-northeast1"
